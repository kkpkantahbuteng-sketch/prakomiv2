        { modul: "Administrasi & Penilaian", question: "Jabatan Fungsional Pranata Komputer adalah:", options: ["Jabatan yang berisi fungsi dan tugas berkaitan dengan pelayanan fungsional yang berdasarkan pada keahlian dan ketrampilan tertentu.", "jabatan yang mempunyai ruang lingkup, tugas, tanggung jawab, wewenang, dan hak untuk melaksanakan kegiatan sistem teknologi informasi berbasis komputer.", "pelaksana teknis fungsional di bidang sistem teknologi informasi berbasis komputer pada Instansi Pemerintah.", "Pejabat fungsional yang berkedudukan di bawah dan bertanggung jawab secara langsung kepada JPT madya, JPT pratama, pejabat administrator, atau pejabat pengawas."], correct: 1 },
        { modul: "Administrasi & Penilaian", question: "Kedudukan pejabat fungsional Pranata Komputer ditetapkan dalam peta jabatan berdasarkan berikut ini, kecuali:", options: ["analisis tugas dan fungsi unit kerja", "analisis jabatan", "analisis beban kerja", "analisis teknologi informasi"], correct: 3 },
        { modul: "Administrasi & Penilaian", question: "Tugas jabatan seorang Pranata Komputer adalah melaksanakan kegiatan TI berbasis komputer yang meliputi:", options: ["tata kelola dan tata laksana teknologi informasi, infrastruktur teknologi informasi, serta sistem informasi dan multimedia.", "tata kelola dan tata laksana teknologi informasi, sarana teknologi informasi, serta sistem informasi dan multimedia", "tata kelola dan tata laksana teknologi informasi, infrastruktur teknologi informasi, serta sistem informasi dan multidmensi", "tata kelola dan tata laksana teknologi informasi, infrastruktur teknologi informasi, serta sistem informasi dan multilateral"], correct: 0 },
        { modul: "Administrasi & Penilaian", question: "Pengangkatan PNS ke dalam jabatan fungsional Pranata Komputer dilakukan melalui pengangkatan:", options: ["pengaktifan, perpindahan dari jabatan lain, promosi", "Pertama, perpindahan unit kerja, promosi", "Pertama, perpindahan dari jabatan lain, promosi", "Pertama, perpindahan unit kerja, promosi"], correct: 2 },
        { modul: "Administrasi & Penilaian", question: "Pengangkatan dalam jabatan fungsional Pranata Komputer melalui pengangkatan pertama harus memenuhi syarat berikut ini, kecuali:", options: ["berstatus PNS", "berijazah diploma tiga di bidang TI untuk kategori ketrampilan", "berijazah diploma empat atau sarjana di bidang TI untuk kategori keahlian", "PPK bernilai baik dalam 2 (dua tahun terakhir)"], correct: 3 },
    ];

    // --------------------------------------------------------------
    // RENDER
    // --------------------------------------------------------------
    const container = document.getElementById('questionsContainer');
    const modulFilter = document.getElementById('modulFilter');
    const statusFilter = document.getElementById('statusFilter');
    const toggleAllBtn = document.getElementById('toggleAllBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statsDisplay = document.getElementById('statsDisplay');
    const totalSoalSpan = document.getElementById('totalSoalCount');

    // state
    let jawabanUser = new Array(soalData.length).fill(null); // index jawaban yang dipilih
    let showAllAnswers = false;

    // populate modul filter
    const moduls = [...new Set(soalData.map(s => s.modul))];
    moduls.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        modulFilter.appendChild(opt);
    });

    function render() {
        const filterModul = modulFilter.value;
        const filterStatus = statusFilter.value;

        let filtered = soalData.filter((s, idx) => {
            if (filterModul !== 'all' && s.modul !== filterModul) return false;
            if (filterStatus === 'unanswered' && jawabanUser[idx] !== null) return false;
            if (filterStatus === 'answered' && jawabanUser[idx] === null) return false;
            return true;
        });

        // get indices untuk mapping
        const indices = [];
        soalData.forEach((s, idx) => {
            if (filterModul !== 'all' && s.modul !== filterModul) return;
            if (filterStatus === 'unanswered' && jawabanUser[idx] !== null) return;
            if (filterStatus === 'answered' && jawabanUser[idx] === null) return;
            indices.push(idx);
        });

        let html = '';
        filtered.forEach((s, i) => {
            const realIdx = indices[i];
            const selected = jawabanUser[realIdx];
            const letters = ['a', 'b', 'c', 'd'];

            html += `<div class="question-card" data-index="${realIdx}">`;
            html += `<div class="question-header">`;
            html += `<div class="question-text">${s.question}</div>`;
            html += `<span class="badge-modul">${s.modul}</span>`;
            html += `</div>`;
            html += `<div class="options">`;
            s.options.forEach((opt, oi) => {
                let cls = 'option-item';
                if (selected !== null) {
                    if (oi === s.correct) cls += ' correct';
                    else if (oi === selected && oi !== s.correct) cls += ' wrong';
                }
                html += `<div class="${cls}" data-optindex="${oi}" style="cursor:pointer;">`;
                html += `<span class="letter">${letters[oi]}</span>`;
                html += `<span>${opt}</span>`;
                html += `</div>`;
            });
            html += `</div>`;

            // answer reveal
            const show = (selected !== null || showAllAnswers);
            html += `<div class="answer-reveal ${show ? 'show' : ''}">`;
            html += `<strong><i class="fas fa-check-circle" style="color:#059669;"></i> Jawaban: ${letters[s.correct]}. ${s.options[s.correct]}</strong>`;
            html += `<div class="explanation"><i class="fas fa-book-open" style="color:#2563eb;"></i> Berdasarkan modul ${s.modul}</div>`;
            html += `</div>`;
            html += `</div>`;
        });

        container.innerHTML = html;

        // attach click listeners
        document.querySelectorAll('.question-card').forEach(card => {
            const idx = parseInt(card.dataset.index);
            card.querySelectorAll('.option-item').forEach(opt => {
                opt.addEventListener('click', function(e) {
                    const oi = parseInt(this.dataset.optindex);
                    if (jawabanUser[idx] !== null) return; // sudah dijawab
                    jawabanUser[idx] = oi;
                    render();
                    updateStats();
                });
            });
        });

        updateStats();
        totalSoalSpan.textContent = soalData.length;
    }

    function updateStats() {
        const answered = jawabanUser.filter(a => a !== null).length;
        statsDisplay.textContent = `${answered} / ${soalData.length} dijawab`;
    }

    // event listeners
    modulFilter.addEventListener('change', render);
    statusFilter.addEventListener('change', render);

    toggleAllBtn.addEventListener('click', function() {
        showAllAnswers = !showAllAnswers;
        this.innerHTML = showAllAnswers ? '<i class="fas fa-chevron-up"></i> Sembunyikan Jawaban' : '<i class="fas fa-chevron-down"></i> Tampilkan Semua Jawaban';
        render();
    });

    resetBtn.addEventListener('click', function() {
        jawabanUser = new Array(soalData.length).fill(null);
        showAllAnswers = false;
        toggleAllBtn.innerHTML = '<i class="fas fa-chevron-down"></i> Tampilkan Semua Jawaban';
        modulFilter.value = 'all';
        statusFilter.value = 'all';
        render();
    });

    // initial render
    render();
</script>
</body>
</html>
